name: Build Biomedical EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PyInstaller and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller flask  # Using Flask to serve the HTML locally

      - name: Create Launcher Script
        shell: pwsh
        run: |
          # Creates a simple Python script that opens your HTML file in the default browser
          $pythonScript = @"
          import webbrowser
          import os
          import sys

          def resource_path(relative_path):
              if hasattr(sys, '_MEIPASS'):
                  return os.path.join(sys._MEIPASS, relative_path)
              return os.path.join(os.path.abspath("."), relative_path)

          path = resource_path("index.html")
          webbrowser.open('file://' + path)
          "@
          $pythonScript | Out-File -FilePath "launcher.py" -Encoding utf8

      - name: Build EXE with PyInstaller
        run: |
          # --onefile: single EXE
          # --noconsole: don't open a black terminal window
          # --add-data: include your index.html inside the EXE
          pyinstaller --onefile --noconsole --add-data "index.html;." launcher.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Biomedical-App-EXE
          path: dist/launcher.exe
